name: Week 10 RViz Joints Evidence

on:
  push:
    paths:
      - ".github/workflows/week10-rviz-joints.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rviz-joints:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Start headless X11
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick
          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

      - name: Start official Hand Solo MoveIt RViz
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          cd world
          docker compose pull omron_handsolo
          docker compose up -d omron_handsolo
          sleep 65
          docker compose ps

      - name: Capture exact Pick Carry Place joint goal states
        run: |
          mkdir -p rviz-evidence

          RVIZ_ID=$(xdotool search --onlyvisible --name "handsolo-moveit.rviz" | head -1 || true)
          if [ -z "$RVIZ_ID" ]; then
            RVIZ_ID=$(xdotool search --onlyvisible --name "RViz" | head -1 || true)
          fi
          echo "RViz ID: $RVIZ_ID"

          xdotool windowmap "$RVIZ_ID" || true
          xdotool windowsize --sync "$RVIZ_ID" 1500 900 || true
          xdotool windowmove "$RVIZ_ID" 5 5 || true
          xdotool windowraise "$RVIZ_ID" || true
          xdotool windowactivate --sync "$RVIZ_ID" || true
          sleep 4

          # Calibrated against a real 1920x1080 root capture.
          # MotionPlanning -> Joints tab center is approximately (202,429).
          xdotool mousemove --window "$RVIZ_ID" 197 424
          xdotool click 1
          sleep 3
          import -display :99 -window root rviz-evidence/rviz_joints_tab_open.png

          # Recalibrated from the actual RViz artifact.
          # Value bar is approximately x=112..501.
          # Joint row centers are y=434,449,464,479,494,509.
          # PICK waypoint 3: [0.785,-0.8,1.4,0,0.8,0] ~= [45,-46,80,0,46,0] deg.
          set_click 331 434
          set_click 282 449
          set_click 400 464
          set_click 307 479
          set_click 332 494
          set_click 307 509
          xdotool windowraise "$RVIZ_ID" || true
          sleep 3
          import -display :99 -window root rviz-evidence/rviz_pick_position_JOINTS.png

          # CARRY waypoint 4: [0.785,-0.3,1.2,0,1.0,0] ~= [45,-17,69,0,57,0] deg.
          set_click 331 434
          set_click 297 449
          set_click 387 464
          set_click 307 479
          set_click 337 494
          set_click 307 509
          xdotool windowraise "$RVIZ_ID" || true
          sleep 3
          import -display :99 -window root rviz-evidence/rviz_carry_position_JOINTS.png

          # PLACE waypoint 5: [-0.785,-0.5,1.2,0,1.0,0] ~= [-45,-29,69,0,57,0] deg.
          set_click 282 434
          set_click 291 449
          set_click 387 464
          set_click 307 479
          set_click 337 494
          set_click 307 509
          xdotool windowraise "$RVIZ_ID" || true
          sleep 3
          import -display :99 -window root rviz-evidence/rviz_place_position_JOINTS.png

      - name: Upload RViz Joints evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week10-rviz-joints-evidence
          path: rviz-evidence/

      - name: Stop environment
        if: always()
        run: |
          cd world
          docker compose down -v || true
