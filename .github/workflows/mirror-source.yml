name: Copy IRS_2026_GROUP5 into Clone

on:
  push:
    paths:
      - ".github/workflows/mirror-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Clone
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy source project without old workflow files
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lephuc2730/IRS_2026_GROUP5.git /tmp/source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/source/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to copy."
          else
            git commit -m "Copy project from IRS_2026_GROUP5"
            git push origin main
          fi
