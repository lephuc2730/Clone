name: Grand Challenge Preflight

on:
  push:
    paths:
      - ".github/workflows/grand-challenge-preflight.yml"
      - "pa_warehouse_status/**"
      - "scripts/grand_challenge_preflight.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Clone
        uses: actions/checkout@v4
        with:
          path: student

      - name: Start headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Prepare official course environment
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5
          rsync -a --exclude='.git/' --exclude='.github/' student/ world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5/

      - name: Start official Pine-Apple + Hand Solo stack
        working-directory: world
        run: |
          docker compose pull irs-simulation irs-openplc-runtime omron-workspace omron_handsolo
          docker compose up -d irs-simulation irs-openplc-runtime omron-workspace omron_handsolo
          sleep 65
          docker compose ps

      - name: Build Grand Challenge packages
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status hand_solo_virtual_nav hand_solo_arm --event-handlers console_direct+
            source install/setup.bash
            ros2 pkg executables pa_warehouse_status
            test -f install/pa_warehouse_status/share/pa_warehouse_status/config/grand_challenge_params.yaml
            test -f install/pa_warehouse_status/share/pa_warehouse_status/launch/grand_challenge.launch.py
          '

      - name: Launch integrated controller safely
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec -d "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            source install/setup.bash
            ros2 launch pa_warehouse_status grand_challenge.launch.py > /workspace/grand_challenge_controller.log 2>&1
          '
          sleep 8

      - name: Verify full Grand Challenge interfaces
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            source install/setup.bash

            bash src/IRS_2026_GROUP5/scripts/grand_challenge_preflight.sh

            echo "=== Controller ==="
            cat /workspace/grand_challenge_controller.log
            grep -q "WAITING_FOR_JUDGE_INITIAL_POSE" /workspace/grand_challenge_controller.log

            echo "=== Warehouse services ==="
            ros2 service list -t | grep "^/warehouse/"
            for srv in start_large start_medium start_small retry_current reset_queue; do
              ros2 service list | grep -Fxq "/warehouse/$srv"
            done

            echo "=== Warehouse topics ==="
            ros2 topic list -t | grep "^/warehouse/"
            ros2 topic list | grep -Fxq /warehouse/mission_status
            ros2 topic list | grep -Fxq /warehouse/gripper_command

            echo "=== PLC sample ==="
            timeout 5s ros2 topic echo /hmi/unified_status --once || true

            echo "=== Safety-locked manual queue test ==="
            ros2 service call /warehouse/start_large std_srvs/srv/Trigger "{}"
            sleep 2
            timeout 5s ros2 topic echo /warehouse/mission_status --once || true
          '

      - name: Save preflight logs
        if: always()
        run: |
          mkdir -p preflight
          WS_ID=$(docker compose -f world/compose.yaml ps -q omron-workspace || true)
          if [ -n "$WS_ID" ]; then
            docker cp "$WS_ID":/workspace/grand_challenge_controller.log preflight/controller.log 2>/dev/null || true
          fi
          docker compose -f world/compose.yaml logs --no-color --tail=250 omron_handsolo > preflight/omron_handsolo.log 2>&1 || true
          docker compose -f world/compose.yaml logs --no-color --tail=200 irs-simulation > preflight/irs_simulation.log 2>&1 || true

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-challenge-preflight
          path: preflight/

      - name: Stop environment
        if: always()
        working-directory: world
        run: docker compose down -v || true
