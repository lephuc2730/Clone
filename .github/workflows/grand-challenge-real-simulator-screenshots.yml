name: Grand Challenge Real Simulator Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grand-challenge-real-simulator-screenshots.yml'

permissions:
  contents: read

jobs:
  capture-real-simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Clone
        uses: actions/checkout@v4
        with:
          path: student

      - name: Start X display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot x11-utils
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/simulator-screenshots"
          sleep 2

      - name: Prepare official course environment
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src/Clone
          rsync -a --exclude='.git/' --exclude='.github/' student/ world/workspace/workspace/irs_ws/src/Clone/
          sed -i 's/tm_use_simulation:=false/tm_use_simulation:=true/' world/compose.yaml

      - name: Start official Pine-Apple simulator and Hand Solo
        working-directory: world
        run: |
          docker compose up -d irs-simulation irs-openplc-runtime omron-workspace omron_handsolo
          sleep 75
          docker compose ps
          echo "=== X windows ==="
          DISPLAY=:99 xwininfo -root -tree || true

      - name: Install proven Grand Challenge Nav2 config
        working-directory: world
        run: |
          TARGET=$(docker exec omron_handsolo sh -lc "find / -type f -path '*/handsolo_ros/config/handsolo-nav2.yaml' 2>/dev/null | head -1")
          echo "Hand Solo Nav2 config: $TARGET"
          test -n "$TARGET"
          cp ../student/config/handsolo-nav2-grand-challenge.yaml /tmp/handsolo-nav2-screenshot.yaml
          sed -i 's/transform_tolerance: 10.0/transform_tolerance: 15.0/g' /tmp/handsolo-nav2-screenshot.yaml
          docker cp /tmp/handsolo-nav2-screenshot.yaml omron_handsolo:"$TARGET"
          docker restart omron_handsolo
          sleep 40

      - name: Verify screenshot Nav2 tolerance
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          for attempt in 1 2 3 4 5 6 7 8; do
            VALUE=$(docker exec "$WS_ID" bash -lc 'source /opt/ros/jazzy/setup.bash; ros2 param get /controller_server FollowPath.transform_tolerance 2>/dev/null' || true)
            echo "attempt $attempt: $VALUE"
            if echo "$VALUE" | grep -q "15.0"; then
              echo "SCREENSHOT_NAV2_TOLERANCE_READY"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: screenshot Nav2 tolerance did not load."
          exit 1

      - name: Build Clone packages
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status hand_solo_virtual_nav hand_solo_arm
          '

      - name: Apply proven Nav2 tuning
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            bash /workspace/irs_ws/src/Clone/scripts/apply_grand_challenge_nav2_tuning.sh
          '

      - name: Restore capture TF tolerance after runtime tuning
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            ros2 param set /controller_server FollowPath.transform_tolerance 15.0
            ros2 param set /local_costmap/local_costmap transform_tolerance 15.0
            ros2 param set /global_costmap/global_costmap transform_tolerance 15.0
            ros2 param set /behavior_server transform_tolerance 15.0
            ros2 param get /controller_server FollowPath.transform_tolerance
          '

      - name: Initialize localization
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            bash /workspace/irs_ws/src/Clone/scripts/initialize_grand_challenge_localization.sh
          '
          sleep 5

      - name: Capture 01 localized simulator
        run: |
          DISPLAY=:99 scrot "$GITHUB_WORKSPACE/simulator-screenshots/01_localized_ready.png"
          file "$GITHUB_WORKSPACE/simulator-screenshots/01_localized_ready.png"
          ls -lh "$GITHUB_WORKSPACE/simulator-screenshots/01_localized_ready.png"

      - name: Navigate to conveyor pickup
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 180s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 5.0, y: 0.0, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/pickup.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/pickup.txt
          '
          sleep 4

      - name: Capture 02 conveyor pickup
        run: |
          DISPLAY=:99 scrot "$GITHUB_WORKSPACE/simulator-screenshots/02_conveyor_pickup.png"
          file "$GITHUB_WORKSPACE/simulator-screenshots/02_conveyor_pickup.png"
          ls -lh "$GITHUB_WORKSPACE/simulator-screenshots/02_conveyor_pickup.png"

      - name: Navigate to Large shelf
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 240s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 31.0, y: -5.5, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/shelf.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/shelf.txt
          '
          sleep 4

      - name: Capture 03 Large shelf
        run: |
          DISPLAY=:99 scrot "$GITHUB_WORKSPACE/simulator-screenshots/03_large_shelf.png"
          file "$GITHUB_WORKSPACE/simulator-screenshots/03_large_shelf.png"
          ls -lh "$GITHUB_WORKSPACE/simulator-screenshots/03_large_shelf.png"

      - name: Return to conveyor pickup
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 240s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 5.0, y: 0.0, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/return.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/return.txt
          '
          sleep 4

      - name: Capture 04 returned to pickup
        run: |
          DISPLAY=:99 scrot "$GITHUB_WORKSPACE/simulator-screenshots/04_returned_to_pickup.png"
          file "$GITHUB_WORKSPACE/simulator-screenshots/04_returned_to_pickup.png"
          ls -lh "$GITHUB_WORKSPACE/simulator-screenshots/04_returned_to_pickup.png"

      - name: Upload real simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pineapple-simulator-screenshots
          path: simulator-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Collect navigation logs
        if: always()
        working-directory: world
        run: |
          docker compose logs --no-color --tail=1000 omron_handsolo | grep -Ei "Goal succeeded|Reached the goal|Transform data too old|Failed to transform|aborting|planner|controller" || true

      - name: Stop official stack
        if: always()
        working-directory: world
        run: docker compose down -v || true
