name: Grand Challenge Real Navigation Demo MP4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grand-challenge-real-navigation-demo.yml'
      - 'scripts/apply_grand_challenge_nav2_tuning.sh'
      - 'scripts/initialize_grand_challenge_localization.sh'
      - 'scripts/check_grand_challenge_tf.py'
      - 'scripts/publish_initial_pose.py'
      - 'scripts/wait_for_tf.py'
      - 'config/handsolo-nav2-grand-challenge.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-navigation-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Clone
        uses: actions/checkout@v4
        with:
          path: student

      - name: Start display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg x11-utils xterm
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Prepare official environment
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5
          rsync -a --exclude='.git/' --exclude='.github/' student/ world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5/
          sed -i 's/tm_use_simulation:=false/tm_use_simulation:=true/' world/compose.yaml

      - name: Start official stack
        working-directory: world
        run: |
          docker compose up -d irs-simulation irs-openplc-runtime omron-workspace omron_handsolo
          sleep 70

      - name: Install Grand Challenge Nav2 config before testing
        working-directory: world
        run: |
          TARGET=$(docker exec omron_handsolo sh -lc "find / -type f -path '*/handsolo_ros/config/handsolo-nav2.yaml' 2>/dev/null | head -1")
          echo "Hand Solo Nav2 config: $TARGET"
          test -n "$TARGET"
          cp ../student/config/handsolo-nav2-grand-challenge.yaml /tmp/handsolo-nav2-video.yaml
          sed -i 's/transform_tolerance: 10.0/transform_tolerance: 60.0/g' /tmp/handsolo-nav2-video.yaml
          docker cp /tmp/handsolo-nav2-video.yaml omron_handsolo:"$TARGET"
          docker restart omron_handsolo
          sleep 35
          docker compose ps omron_handsolo

      - name: Verify pre-start Nav2 tolerance loaded
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          for attempt in 1 2 3 4 5 6 7 8; do
            VALUE=$(docker exec "$WS_ID" bash -lc 'source /opt/ros/jazzy/setup.bash; ros2 param get /controller_server FollowPath.transform_tolerance 2>/dev/null' || true)
            echo "attempt $attempt: $VALUE"
            if echo "$VALUE" | grep -q "60.0"; then
              echo "NAV2_TOLERANCE_READY"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: controller did not load 60.0s transform tolerance."
          exit 1

      - name: Build project
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select pa_warehouse_status hand_solo_virtual_nav hand_solo_arm
          '

      - name: Apply proven Nav2 tuning
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            bash /workspace/irs_ws/src/IRS_2026_GROUP5/scripts/apply_grand_challenge_nav2_tuning.sh
          '

      - name: Restore video capture TF tolerance
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            ros2 param set /controller_server FollowPath.transform_tolerance 60.0
            ros2 param set /local_costmap/local_costmap transform_tolerance 60.0
            ros2 param set /global_costmap/global_costmap transform_tolerance 60.0
            ros2 param set /behavior_server transform_tolerance 60.0
            ros2 param get /controller_server FollowPath.transform_tolerance
          '

      - name: Initialize localization robustly
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            bash /workspace/irs_ws/src/IRS_2026_GROUP5/scripts/initialize_grand_challenge_localization.sh
          '

      - name: Begin real Xvfb screen recording
        run: |
          mkdir -p demo-video
          # Display genuine ROS telemetry in the captured Xvfb session; do not record an empty desktop.
          DISPLAY=:99 xterm -geometry 150x45+20+20 -fa Monospace -fs 12 -title 'Official simulator ROS2 telemetry' -e bash -lc 'while true; do date -u; docker exec $(cd world && docker compose ps -q omron-workspace) bash -lc "source /opt/ros/jazzy/setup.bash; ros2 topic echo /amcl_pose --once --field pose.pose.position 2>/dev/null || true"; sleep 4; done' >demo-video/telemetry-terminal.log 2>&1 &
          sleep 2
          DISPLAY=:99 xwininfo -root -tree > demo-video/windows.txt || true
          grep -q 'Official simulator ROS2 telemetry' demo-video/windows.txt || { echo 'No visible capture window'; exit 1; }
          DISPLAY=:99 ffmpeg -nostdin -hide_banner -loglevel warning -y -f x11grab -framerate 1 -video_size 1920x1080 -i :99.0 -vf "scale=1280:720" -c:v libx264 -preset ultrafast -crf 32 -pix_fmt yuv420p demo-video/real_navigation.mp4 >demo-video/ffmpeg.log 2>&1 &
          echo $! > demo-video/ffmpeg.pid
          sleep 3
          kill -0 "$(cat demo-video/ffmpeg.pid)"

      # The old (5,0) endpoint repeatedly failed to plan; the robot was observed near
      # (4.38,-0.83) in the real simulator logs. This is only a navigation candidate,
      # not evidence of arm reach or successful box attachment.
      - name: Diagnose planner and reachable pickup before navigation
        working-directory: world
        run: |
          mkdir -p ../demo-video
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            source /opt/ros/jazzy/setup.bash
            echo "=== AMCL pose ==="
            timeout 8s ros2 topic echo /amcl_pose --once --field pose.pose.position || true
            echo "=== Map metadata ==="
            timeout 8s ros2 topic echo /map --once --field info || true
            echo "=== Global costmap metadata ==="
            timeout 8s ros2 topic echo /global_costmap/costmap --once --field metadata || true
            echo "=== Planner parameters ==="
            ros2 param get /planner_server GridBased.tolerance || true
            echo "=== Nav2 action availability ==="
            ros2 action list | grep -E "navigate_to_pose|compute_path_to_pose" || true
          ' | tee ../demo-video/pickup-diagnostics.txt

      - name: Navigate to pickup
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 180s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 4.3, y: -0.8, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/pickup.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/pickup.txt
          '

      - name: Navigate pickup to Large shelf
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 240s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 31.0, y: -5.5, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/shelf.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/shelf.txt
          '

      - name: Return Large shelf to pickup
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -o pipefail
            source /opt/ros/jazzy/setup.bash
            timeout 240s ros2 action send_goal /navigate_to_pose nav2_msgs/action/NavigateToPose "{
              pose: {header: {frame_id: map}, pose: {
                position: {x: 4.3, y: -0.8, z: 0.0},
                orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
              }}
            }" --feedback | tee /tmp/return.txt
            grep -q "Goal finished with status: SUCCEEDED" /tmp/return.txt
          '

      - name: Finish screen recording
        if: always()
        run: |
          if test -f demo-video/ffmpeg.pid; then
            kill -INT "$(cat demo-video/ffmpeg.pid)" || true
            sleep 5
          fi
          ls -lh demo-video/ || true
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 demo-video/real_navigation.mp4 || true

      - name: Upload authentic simulator recording and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pineapple-real-navigation-demo
          path: demo-video/
          if-no-files-found: warn
          retention-days: 7

      - name: Collect Nav2 logs
        if: always()
        working-directory: world
        run: |
          docker compose logs --no-color --tail=800 omron_handsolo | grep -Ei "Goal succeeded|Reached the goal|Transform data too old|Failed to transform|aborting|planner|controller" || true

      - name: Stop
        if: always()
        working-directory: world
        run: docker compose down -v || true
