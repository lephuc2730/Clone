name: Grand Challenge Step 4 - Arm Sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/grand-challenge-step4-arm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Clone
        uses: actions/checkout@v4
        with:
          path: student

      - name: Start display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Prepare official stack
        run: |
          git clone --depth 1 https://github.com/CollaborativeRoboticsLab/industrial-robots-and-systems-world.git world
          mkdir -p world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5
          rsync -a --exclude='.git/' --exclude='.github/' student/ world/workspace/workspace/irs_ws/src/IRS_2026_GROUP5/
          sed -i 's/tm_use_simulation:=false/tm_use_simulation:=true/' world/compose.yaml

      - name: Start official stack
        working-directory: world
        run: |
          docker compose up -d irs-simulation omron-workspace omron_handsolo
          sleep 65

      - name: Build arm package
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            colcon build --packages-select hand_solo_arm
            source install/setup.bash
          '

      - name: Run MoveIt arm sequence
        working-directory: world
        run: |
          WS_ID=$(docker compose ps -q omron-workspace)
          docker exec "$WS_ID" bash -lc '
            set -e
            source /opt/ros/jazzy/setup.bash
            cd /workspace/irs_ws
            source install/setup.bash
            timeout 180s ros2 run hand_solo_arm hs_pick_place | tee /tmp/arm_sequence.txt
            grep -q "Sequence complete" /tmp/arm_sequence.txt
          '

      - name: Stop
        if: always()
        working-directory: world
        run: docker compose down -v || true
